  <link rel="icon" href="/brand/favicon.ico" sizes="any">
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());function enomaGaConfig(c){try{var m=location.search.match(/[?&]internal=([01])(?:&|$)/);if(m)localStorage.setItem('enoma_internal',m[1]);if(localStorage.getItem('enoma_internal')==='1')c.traffic_type='internal'}catch(e){}try{if(/(?:^|; )enoma_internal=1(?:;|$)/.test(document.cookie))c.traffic_type='internal'}catch(e){}if(navigator.webdriver)window['ga-disable-G-S8XTG72Y2Y']=true;return c};gtag('config','G-S8XTG72Y2Y',enomaGaConfig({}));</script>

<body class="page-claim">
<script src="/scripts/ref-capture.js"></script>
<script type="module" src="/partials/nav.js"></script>

<div class="auth-page">
  <div class="auth-card">
    <div class="spinner" id="claim-spinner"></div>
    <p class="auth-eyebrow">Keep your page</p>
    <h1 id="claim-heading">Just a moment…</h1>
    <p class="auth-subtitle" id="claim-message"></p>

    <!-- The email's button lands here with token_hash. Nothing is verified
         until this button is clicked, so email link scanners can't use it up. -->
    <div class="claim-confirm" id="confirm-view" hidden>
      <button type="button" class="btn btn--primary claim-btn" id="confirm-btn">Confirm and keep my page</button>
    </div>

    <!-- The 6-digit code from the same email. -->
    <div class="claim-code" id="code-view" hidden>
      <form id="code-form" novalidate>
        <label for="code-email">Email</label>
        <input id="code-email" type="email" autocomplete="email" placeholder="you@yourbusiness.com" required />
        <label for="code-input">6-digit code</label>
        <input id="code-input" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="7" placeholder="123456" required />
        <button type="submit" class="btn btn--primary claim-btn" id="code-submit">Keep my page</button>
      </form>
      <p class="code-msg" id="code-msg" role="status" hidden></p>
      <p class="code-alt"><button type="button" class="link-like" id="code-resend">Send a new code</button> · <a id="password-link" href="/login">Sign in with a password</a></p>
    </div>

    <a class="claim-link" id="claim-link" hidden>Go to your dashboard →</a>
  </div>
</div>

<style>
body.page-claim [hidden] { display: none !important; }
body.page-claim .auth-subtitle.is-error { color: var(--danger); }
body.page-claim .claim-confirm { margin-top: 1.5rem; }
body.page-claim .claim-btn { width: 100%; min-height: 48px; justify-content: center; font-size: 1rem; }
body.page-claim .claim-code { margin-top: 1.25rem; text-align: left; }
body.page-claim .claim-code label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--ink); margin: 0.75rem 0 0.3rem; }
body.page-claim .claim-code input { width: 100%; min-height: 46px; padding: 0.65rem 0.8rem; border: 1px solid var(--border-strong); border-radius: 10px; font: inherit; font-size: 1rem; box-sizing: border-box; }
body.page-claim .claim-code .code-input { font-family: var(--font-mono); font-size: 1.4rem; letter-spacing: 0.3em; text-align: center; }
body.page-claim .claim-code .claim-btn { margin-top: 1rem; }
body.page-claim .code-msg { font-size: 0.88rem; color: var(--muted); margin: 0.75rem 0 0; line-height: 1.5; }
body.page-claim .code-msg.is-error { color: var(--danger); }
body.page-claim .code-alt { font-size: 0.85rem; color: var(--muted); margin: 1rem 0 0; text-align: center; }
body.page-claim .code-alt a, body.page-claim .link-like { color: var(--accent); font-weight: 600; text-decoration: none; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
</style>

<script src="/scripts/claim-login.js"></script>
<script>
function start() {
  var L = window.EnomaClaimLogin;
  L.initClaimPage({
    doc: document,
    search: window.location.search,
    hash: window.location.hash,
    sb: L.client(window),
    fetch: window.fetch.bind(window),
    go: function (url) { window.location.href = url; },
    storage: window.localStorage,
    gtag: window.gtag,
  });
}
function failed() {
  document.getElementById('claim-spinner').hidden = true;
  document.getElementById('claim-heading').textContent = 'Failed to load';
  document.getElementById('claim-message').textContent = 'Please refresh the page and try again.';
}
function loadScript(src, onload, onerror) {
  var s = document.createElement('script');
  s.src = src; s.onload = onload; s.onerror = onerror;
  document.head.appendChild(s);
}
loadScript('https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js', start, function () {
  loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js', start, failed);
});
</script>

<div id="site-footer"></div>
<script>fetch("/partials/footer.html").then(r=>r.text()).then(h=>{document.getElementById("site-footer").innerHTML=h});</script>
<script src="/scripts/global-cta.js" defer></script>
</body>
</html>
