<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <script src="/scripts/clarity.js" defer></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());function enomaGaConfig(c){try{var m=location.search.match(/[?&]internal=([01])(?:&|$)/);if(m)localStorage.setItem('enoma_internal',m[1]);if(localStorage.getItem('enoma_internal')==='1')c.traffic_type='internal'}catch(e){}try{if(/(?:^|; )enoma_internal=1(?:;|$)/.test(document.cookie))c.traffic_type='internal'}catch(e){}if(navigator.webdriver)window['ga-disable-G-S8XTG72Y2Y']=true;return c};gtag('config','G-S8XTG72Y2Y',enomaGaConfig({}));</script>
</head>
<body class="page-claim">
<script src="/scripts/ref-capture.js"></script>
<script type="module" src="/partials/nav.js"></script>

<div class="auth-page">
  <div class="auth-card">
    <div class="spinner" id="claim-spinner"></div>
    <p class="auth-eyebrow">Claim this page</p>
    <h1 id="claim-heading">Confirming your account…</h1>
    <p class="auth-subtitle" id="claim-message">Just a moment.</p>
    <a class="claim-link" id="claim-link" style="display:none;">Go to your dashboard →</a>
  </div>
</div>

<script>
var SUPABASE_URL = 'https://qhsivcenpnxwmvwznqie.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoc2l2Y2VucG54d212d3pucWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODQ4NjMsImV4cCI6MjA4MDI2MDg2M30.g_3eHoqfo7R15Q_9OoBy0DTq66a3BPA838VFd1aZtnc';

var params = new URLSearchParams(window.location.search);
var slug = params.get('business') || '';
var outreachMsg = params.get('m') || '';

function setStatus(heading, message, isError) {
  document.getElementById('claim-spinner').style.display = 'none';
  document.getElementById('claim-heading').textContent = heading;
  var msgEl = document.getElementById('claim-message');
  msgEl.textContent = message;
  msgEl.style.color = isError ? 'var(--danger)' : 'var(--muted)';
}

// First landing + utm_* stored by /scripts/ref-capture.js (never replaced).
function firstTouch() {
  try { return JSON.parse(localStorage.getItem('enoma_first_touch') || 'null'); } catch (e) { return null; }
}

function showDashboardLink(businessId) {
  var link = document.getElementById('claim-link');
  link.href = '/dashboard?business_id=' + encodeURIComponent(businessId);
  link.style.display = 'inline-block';
}

async function run() {
  if (!slug) {
    setStatus('Missing business', 'No business was specified to claim.', true);
    return;
  }

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var sessionRes = await sb.auth.getSession();
  var session = sessionRes.data && sessionRes.data.session;

  if (!session) {
    setStatus('Please sign in', 'Redirecting you to sign in first…', false);
    var next = '/claim?business=' + encodeURIComponent(slug) + (outreachMsg ? '&m=' + encodeURIComponent(outreachMsg) : '');
    setTimeout(function () {
      window.location.href = '/login?next=' + encodeURIComponent(next);
    }, 1200);
    return;
  }

  try {
    var res = await fetch('/api/claim-business', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
      body: JSON.stringify({
        slug: slug, m: outreachMsg || undefined, first_touch: firstTouch(),
        anon_id: (function () { try { return localStorage.getItem('enoma_anon_id'); } catch (e) { return null; } })()
      })
    });
    var data = await res.json();
    if (!res.ok) {
      setStatus('Could not claim this page', data.error || 'Something went wrong.', true);
      return;
    }
    try { gtag('event', 'business_claimed', { slug: slug, transport_type: 'beacon' }); } catch (e) {}
    setStatus(
      data.already_claimed_by_you ? 'You already claimed this page' : 'Page claimed!',
      'Redirecting to your dashboard…',
      false
    );
    showDashboardLink(data.business_id);
    setTimeout(function () {
      window.location.href = '/dashboard?business_id=' + encodeURIComponent(data.business_id);
    }, 1500);
  } catch (e) {
    setStatus('Something went wrong', 'Please refresh and try again, or contact support.', true);
  }
}

function loadScript(src, onload, onerror) {
  var s = document.createElement('script');
  s.src = src;
  s.onload = onload;
  s.onerror = onerror;
  document.head.appendChild(s);
}

loadScript(
  'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js',
  run,
  function () {
    loadScript(
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
      run,
      function () { setStatus('Failed to load', 'Please refresh the page and try again.', true); }
    );
  }
);
</script>

<div id="site-footer"></div>
<script>fetch("/partials/footer.html").then(r=>r.text()).then(h=>{document.getElementById("site-footer").innerHTML=h});</script>
<script src="/scripts/global-cta.js" defer></script>
</body>
</html>
