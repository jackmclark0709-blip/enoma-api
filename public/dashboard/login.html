<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Enoma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles/enoma.css">
  <link rel="icon" href="/brand/favicon.ico" sizes="any">
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0A1628">
  <meta property="og:image" content="https://enoma.io/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://enoma.io/brand/og-image.png">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S8XTG72Y2Y"></script>
  <script src="/scripts/clarity.js" defer></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());function enomaGaConfig(c){try{var m=location.search.match(/[?&]internal=([01])(?:&|$)/);if(m)localStorage.setItem('enoma_internal',m[1]);if(localStorage.getItem('enoma_internal')==='1')c.traffic_type='internal'}catch(e){}try{if(/(?:^|; )enoma_internal=1(?:;|$)/.test(document.cookie))c.traffic_type='internal'}catch(e){}if(navigator.webdriver)window['ga-disable-G-S8XTG72Y2Y']=true;return c};gtag('config','G-S8XTG72Y2Y',enomaGaConfig({}));</script>
</head>
<body class="page-login">
<script src="/scripts/ref-capture.js"></script>
<script type="module" src="/partials/nav.js"></script>

<div class="auth-page">
  <div class="auth-card">
    <p class="auth-eyebrow">Welcome back</p>
    <h1>Sign in to Enoma</h1>
    <p class="auth-subtitle">Access your dashboard and manage your business website.</p>

    <!-- Code first: we email a 6-digit code (and a button) to the owner.
         Never creates an account (public/scripts/claim-login.js sendLoginCode). -->
    <form id="code-start" class="login-step" novalidate>
      <div class="field">
        <label for="login-email">Email address</label>
        <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <button type="submit" class="submit-btn" id="send-btn">Email me a sign-in code</button>
      <p class="login-msg" id="send-msg" role="status" hidden></p>
    </form>

    <div id="code-sent" class="login-step" hidden>
      <p class="sent-copy" id="sent-copy"></p>
      <form id="verify-form" novalidate>
        <div class="field">
          <label for="login-code">6-digit code</label>
          <input id="login-code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="7" placeholder="123456" required />
        </div>
        <button type="submit" class="submit-btn" id="verify-btn">Sign in</button>
      </form>
      <p class="login-msg" id="verify-msg" role="status" hidden></p>
      <p class="code-alt"><button type="button" class="link-like" id="resend-btn">Resend code</button> · <button type="button" class="link-like" id="change-email">Use a different email</button></p>
    </div>

    <div class="login-divider" role="separator"><span>or</span></div>
    <button type="button" class="link-like login-pw-toggle" id="show-password">Use a password instead</button>

    <!-- Password sign-in, unchanged. -->
    <form id="password-form" class="login-step" novalidate>
      <div id="password-view" hidden>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Your password" autocomplete="current-password" />
        </div>
        <button type="submit" class="submit-btn submit-btn--secondary">Sign in →</button>
        <p class="error-msg" id="error"></p>
      </div>
    </form>
    <p class="auth-links">Don't have an account? <a href="/signup">Create your free website</a></p>
  </div>
</div>

<style>
body.page-login [hidden] { display: none !important; }
body.page-login .submit-btn { min-height: 48px; }
body.page-login .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
body.page-login .submit-btn--secondary { background: var(--surface); color: var(--ink); border: 1.5px solid var(--border-strong); }
body.page-login .field input { min-height: 46px; font-size: 1rem; }
body.page-login .field .code-input { font-family: var(--font-mono); font-size: 1.4rem; letter-spacing: 0.3em; text-align: center; }
body.page-login .sent-copy { font-size: 0.95rem; color: var(--ink); line-height: 1.55; margin: 0 0 1rem; }
body.page-login .login-msg { font-size: 0.88rem; color: var(--muted); margin: 0.75rem 0 0; line-height: 1.5; }
body.page-login .login-msg.is-error { color: var(--danger); }
body.page-login .code-alt { font-size: 0.85rem; color: var(--muted); margin: 1rem 0 0; text-align: center; }
body.page-login .link-like { color: var(--accent); font-weight: 600; background: none; border: 0; padding: 0.35rem 0.1rem; font: inherit; font-weight: 600; cursor: pointer; }
body.page-login .login-divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.5rem 0 0.75rem; color: var(--muted); font-size: 0.8rem; }
body.page-login .login-divider::before, body.page-login .login-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
body.page-login .login-pw-toggle { display: block; margin: 0 auto; min-height: 44px; }
body.page-login #password-view { margin-top: 0.5rem; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/scripts/claim-login.js"></script>
<script>
  (function () {
    var L = window.EnomaClaimLogin;
    var session = null;
    try { session = window.sessionStorage; } catch (e) {}
    L.initLoginPage({
      doc: document,
      search: window.location.search,
      sb: L.client(window),
      go: function (url) { window.location.href = url; },
      session: session,
    });
  })();
</script>

<div id="site-footer"></div>
<script>fetch("/partials/footer.html").then(r=>r.text()).then(h=>{document.getElementById("site-footer").innerHTML=h});</script>
<script src="/scripts/global-cta.js" defer></script>
</body>
</html>
