<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin — Business Profiles</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/styles/enoma.css" />
<style>
  body { padding: 2rem; font-family: Inter, system-ui; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 10px; border: 1px solid #eee; text-align: left; }
  th { background: #f6f7fb; font-weight: 600; }
  #auth-gate { display: none; }
</style>
</head>

<body>

<div id="auth-gate">
  <h1>All Business Profiles</h1>
  <p style="color:#6b7280; margin-bottom:1.5rem;">Admin view — only visible to jack@enoma.io &middot; <a href="/admin/command-center.html">Command Center →</a> &middot; <a href="/admin/sales-queue.html">Sales Queue →</a> &middot; <a href="/admin/voice.html">Voice Agent →</a></p>

  <table>
    <thead>
      <tr>
        <th>Business Name</th>
        <th>Email</th>
        <th>Slug</th>
        <th>Created</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div id="unauth-message" style="text-align:center; margin-top:4rem;">
  <p>Checking credentials…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/scripts/admin-auth.js"></script>
<script>
  async function init() {
    const session = await EnomaAdmin.requireAdminSession();

    const unauthEl = document.getElementById('unauth-message');
    const gateEl = document.getElementById('auth-gate');

    if (!session) {
      unauthEl.innerHTML = '<h2 style="color:#e24b4a;">Unauthorized</h2><p><a href="/login">Sign in</a></p>';
      return;
    }

    // Authorized — show the admin panel
    unauthEl.style.display = 'none';
    gateEl.style.display = 'block';

    const { data, error } = await session.client
      .from('small_business_profiles')
      .select('business_id, business_name, email, username, created_at, is_claimed')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('rows').innerHTML =
        `<tr><td colspan="5" style="color:red;">Failed to load: ${String(error.message).replace(/</g,"&lt;")}</td></tr>`;
      return;
    }

    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const tbody = document.getElementById('rows');
    data.forEach(b => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${esc(b.business_name || '—')}</td>
        <td>${esc(b.email || '—')}</td>
        <td><a href="/${encodeURIComponent(b.username || '')}" target="_blank">${esc(b.username || '—')}</a></td>
        <td>${new Date(b.created_at).toLocaleDateString()}</td>
        <td><a href="/create?business_id=${encodeURIComponent(b.business_id)}">Edit</a>${b.is_claimed ? ` &middot; <button type="button" class="checkout-link" data-id="${esc(b.business_id)}" data-name="${esc(b.business_name || b.username || '')}">Send checkout link</button>` : ''}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Done-for-you: after the setup call, send the owner the same Stripe
  // Checkout they'd get from their dashboard ($1 first month on pricing v2).
  // api/ga-metrics.js?action=checkout_link. The link works for 24 hours.
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('.checkout-link');
    if (!btn) return;
    const session = await EnomaAdmin.requireAdminSession();
    if (!session) return alert('Sign in again.');
    const yearly = confirm(`${btn.dataset.name}: yearly plan ($199/year)?\n\nOK = yearly, Cancel = monthly ($19.99/month).`);
    const send = confirm('Email the link to the owner now?\n\nOK = email it, Cancel = just copy it.');
    btn.disabled = true;
    try {
      const r = await fetch('/api/ga-metrics?action=checkout_link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.accessToken },
        body: JSON.stringify({ business_id: btn.dataset.id, interval: yearly ? 'year' : 'month', send }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.url) return alert(j.error || 'Could not create the checkout link.');
      try { await navigator.clipboard.writeText(j.url); } catch (_) { /* shown below */ }
      alert((j.emailed ? `Emailed to ${j.to}. ` : '') + `Link copied (expires in 24 hours):\n${j.url}`);
    } finally { btn.disabled = false; }
  });

  init();
</script>

</body>
</html>
