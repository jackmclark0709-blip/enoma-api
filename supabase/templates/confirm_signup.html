<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Enoma sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#F4F6F9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F4F6F9;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E2E7EE;border-radius:14px;">
        <tr>
          <td style="padding:28px 28px 8px 28px;font-family:Arial,Helvetica,sans-serif;">
            <img src="https://enoma.io/brand/enoma-wordmark-blue-notagline.png" width="120" alt="enoma" style="display:block;width:120px;height:auto;border:0;font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:bold;color:#0A1628;">
          </td>
        </tr>
        <tr>
          <td style="padding:12px 28px 0 28px;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.5;color:#0A1628;">
            Here's your code to keep your page
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:18px 28px 6px 28px;">
            <div style="font-family:'Courier New',Courier,monospace;font-size:36px;line-height:1.2;font-weight:bold;letter-spacing:8px;color:#0A1628;background:#F4F6F9;border-radius:10px;padding:14px 10px;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:6px 28px 0 28px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#4A5568;">
            Type it on your page, or tap the button:
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:16px 28px 8px 28px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" bgcolor="#C84A12" style="border-radius:10px;">
                  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" target="_blank" style="display:inline-block;padding:14px 26px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#FFFFFF;text-decoration:none;border-radius:10px;">Confirm and keep my page</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px 0 28px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#6B7280;">
            Didn't ask for this? Ignore this email.
          </td>
        </tr>
        <tr>
          <td style="padding:14px 28px 28px 28px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#0A1628;">
            — Jack, Enoma
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
